## render.yaml — Macho ya Mwananchi
## Render reads this file to deploy all 3 services at once.
## Connect your GitHub repo in Render → New → Blueprint to use this file.

services:

  # ─────────────────────────────────────────────────────────────
  # 1. React frontend  (static site — always free on Render)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: macho-ya-mwananchi-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    routes:
      # Forward API calls to the Node server so React can reach it
      - type: rewrite
        source: /api/*
        destination: https://macho-ya-mwananchi-server.onrender.com/api/*
      - type: rewrite
        source: /uploads/*
        destination: https://macho-ya-mwananchi-server.onrender.com/uploads/*
      # React Router: every URL that isn't a file serves index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # ─────────────────────────────────────────────────────────────
  # 2. Node / Express API  (web service — free tier)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: macho-ya-mwananchi-server
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # paste your MongoDB Atlas URI in Render dashboard
      - key: GEMINI_API_KEY
        sync: false          # paste your Anthropic key in Render dashboard
      - key: ADMIN_TOKEN
        generateValue: true  # Render creates a random secret automatically
      - key: AI_SERVICE_URL
        value: https://macho-ya-mwananchi-ai.onrender.com
      - key: CLIENT_URL
        value: https://macho-ya-mwananchi-client.onrender.com

  # ─────────────────────────────────────────────────────────────
  # NOTE: DB Seed — run once manually after first deploy:
  #   Local: cd server && npm run seed   (with Atlas MONGO_URI in server/.env)
  #   OR: Render Shell tab (paid plans) → node seed_db.js
  # ─────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────
  # 3. Python AI / RAG service  (web service — free tier)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: macho-ya-mwananchi-ai
    runtime: python
    rootDir: ai-service
    # Build the vector index here, not at runtime. Render's free tier gives the
    # container an ephemeral disk, so anything indexed after boot is lost on the
    # next cold start — which is why Audit AI used to answer from a hand-written
    # summary. Embeddings are computed locally (ONNX), so this costs build
    # minutes, not API quota, and the finished chroma_db/ ships with the deploy.
    #
    # Measured: ~5 min for 46 PDFs → 3,003 chunks (23 MB index) on a developer
    # laptop; expect longer on the free tier's shared CPU. If a deploy ever
    # times out here, the fallback is to commit ai-service/chroma_db/ (drop it
    # from .gitignore) and remove ingest_all.py from this build command.
    # ingest_all.py is idempotent, so re-running it is always safe.
    buildCommand: pip install -r requirements.txt && python ingest_all.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false          # copy the value Render auto-generated for the server
      - key: ALLOWED_ORIGINS
        value: https://macho-ya-mwananchi-server.onrender.com,https://macho-ya-mwananchi-client.onrender.com
