name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E (hermetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ephemeral MongoDB for this run — no dependency on production data.
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      MONGO_URI: mongodb://127.0.0.1:27017/mym_e2e
      API_PORT: '3011'
      PREVIEW_PORT: '4173'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fast, dependency-free assertion that the AI cannot answer from anything
      # but the indexed OAG PDFs. Runs first so a regression here fails the run
      # in seconds rather than after the full Playwright suite.
      - name: Guard — no unsourced AI answers
        run: python3 tests/guards/test_no_unsourced_answers.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Install dependencies (root = Playwright, server, client) ──
      - name: Install root deps
        run: npm ci

      - name: Install server deps
        run: npm ci
        working-directory: server

      - name: Install client deps
        run: npm ci
        working-directory: client

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── Build the client (tested against the production build) ──
      - name: Build client
        run: npm run build
        working-directory: client

      # ── Seed the ephemeral database ──
      - name: Seed database
        run: npm run seed
        working-directory: server

      # ── Start the stack and run the suite in one shell so the
      #    background servers stay alive for the whole test run. ──
      - name: Start stack and run E2E
        run: |
          # API server — rate limiting disabled so the suite isn't throttled.
          ( cd "$GITHUB_WORKSPACE/server" && \
            DISABLE_RATE_LIMIT=1 NODE_ENV=development PORT="$API_PORT" \
            node server.js > /tmp/api.log 2>&1 & )

          # Client — serve the production build, proxying /api to the API.
          ( cd "$GITHUB_WORKSPACE/client" && \
            VITE_API_URL=http://127.0.0.1:"$API_PORT" \
            npx vite preview --port "$PREVIEW_PORT" --host 127.0.0.1 > /tmp/preview.log 2>&1 & )

          # Wait for both to answer.
          for i in $(seq 1 30); do
            A=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://127.0.0.1:$API_PORT/api/health" || true)
            C=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 "http://127.0.0.1:$PREVIEW_PORT/" || true)
            echo "wait $i: api=$A client=$C"
            [ "$A" = "200" ] && [ "$C" = "200" ] && break
            sleep 2
          done

          BASE_URL="http://127.0.0.1:$PREVIEW_PORT" \
          SERVER_URL="http://127.0.0.1:$API_PORT" \
          CI=true \
            npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Dump server logs on failure
        if: failure()
        run: |
          echo "===== API LOG ====="; cat /tmp/api.log || true
          echo "===== PREVIEW LOG ====="; cat /tmp/preview.log || true
