name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 3. Install deps + Playwright browsers ─────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── 4. Wake up Render + wait for rate limit window to clear ──────
      - name: Wake up Render services
        run: |
          echo "Pinging server..."
          for i in 1 2 3 4 5 6 7 8; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://macho-ya-mwananchi-server.onrender.com/api/health \
              --max-time 30)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Server awake ✅"
              break
            fi
            sleep 20
          done

      # Wait 20s after wake-up so the server is fully ready before tests hammer it
      - name: Allow server to stabilise
        run: sleep 20

      # ── 5. Run E2E tests ──────────────────────────────────────────
      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: https://macho-ya-mwananchi-client.onrender.com
          CI: true

      # ── 6. Upload report on failure ───────────────────────────────
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
