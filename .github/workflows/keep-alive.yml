name: Keep Render services alive

# ⚠️ THIS IS BEST-EFFORT AND IS NOT SUFFICIENT ON ITS OWN. ⚠️
#
# The schedule below asks for every 10 minutes. GitHub throttles and
# deprioritises scheduled workflows on free runners, and what actually happens
# is far less often. Measured over 15 consecutive runs on 2026-09-01:
#
#     gaps (minutes): 339 138 220 355 470 329 131 156 137 239 334 368 136 113
#     minimum 113 · median 239 (~4 hours)
#
# Render's free tier sleeps after 15 minutes of inactivity, so this workflow has
# never once fired inside the sleep window. Treat it as an occasional bonus, not
# as uptime.
#
# WHAT ACTUALLY KEEPS THE SERVICES AWAKE
# --------------------------------------
# An external pinger hitting both health endpoints every 5 minutes. Free options:
# cron-job.org or UptimeRobot. Point them at:
#
#     https://macho-ya-mwananchi-server.onrender.com/api/health
#     https://macho-ya-mwananchi-ai.onrender.com/health
#
# This is not merely a latency concern. A sleeping AI service means a citizen's
# first question — often their only one — can return "I cannot reach the audit
# documents". The application mitigates this in two places (the Audit page wakes
# the service on load, and the query route retries a cold-start failure once),
# but neither replaces keeping the service up.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Long timeouts on purpose: if the service *is* asleep, this run is the
      # thing waking it, and a cold start takes ~60s. Giving up at 30s would
      # abandon the wake-up half-finished.
      - name: Ping server health
        run: |
          curl -sf --max-time 90 \
            https://macho-ya-mwananchi-server.onrender.com/api/health \
            && echo "Server awake" \
            || echo "Server ping failed (may still be cold starting)"

      - name: Ping AI service health
        run: |
          curl -sf --max-time 120 \
            https://macho-ya-mwananchi-ai.onrender.com/health \
            && echo "AI service awake" \
            || echo "AI ping failed (may still be cold starting)"
